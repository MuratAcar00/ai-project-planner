<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Project Planner</title><link rel="stylesheet" href="styles.css"></head>
<body><header><a class="brand" href="#/">AI <span>Project Planner</span></a><p>Turn ideas into an actionable software plan.</p></header><main id="app" aria-live="polite"></main><template id="form-template"><section class="hero"><div><p class="eyebrow">Plan with clarity</p><h1>Build your next project with a practical roadmap.</h1><p>Describe your idea and get a phased, testable development plan in seconds.</p></div></section><section class="panel"><h2>Start a project</h2><form id="project-form" novalidate><div class="form-grid"><label>Project name<input name="name" maxlength="100" required placeholder="e.g. Habit tracker"></label><label>Target platform<select name="platform" required><option value="">Choose a platform</option><option>Web</option><option>Mobile</option><option>Desktop</option><option>API / Backend</option></select></label></div><label>Project description<textarea name="description" maxlength="2000" required placeholder="What problem will it solve, and for whom?"></textarea></label><div class="form-grid"><label>Preferred technology<select name="technology" required><option value="">Choose a technology</option><option>JavaScript</option><option>TypeScript</option><option>Python</option><option>Java</option><option>C#</option><option>Other</option></select></label><label>Experience level<select name="experienceLevel" required><option value="">Choose your level</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div><p id="form-error" class="error" role="alert"></p><button type="submit">Generate development plan <span>→</span></button></form></section><section><div class="section-heading"><div><p class="eyebrow">Your workspace</p><h2>Projects</h2></div></div><div id="project-list" class="project-list"><p class="muted">Loading projects…</p></div></section></template><script src="app.js"></script></body></html>
