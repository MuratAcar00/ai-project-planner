<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autonomous App Factory</title><link rel="stylesheet" href="styles.css"></head>
<body><header><a class="brand" href="#/">Autonomous <span>App Factory</span></a><p>Build ideas into working applications.</p></header><main id="app" aria-live="polite"></main><template id="form-template"><section class="hero"><div><p class="eyebrow">Your autonomous workspace</p><h1>Autonomous App Factory</h1><p>Generate, build, test and run SaaS applications autonomously.</p><label class="platform-preference">Target platform<select id="platform-preference"><option value="auto">Auto</option><option value="web">Web</option><option value="mobile">Mobile</option><option value="web_mobile">Web + Mobile</option></select></label><button id="generate">Generate &amp; Build SaaS</button><p id="factory-message" role="status"></p></div></section><section class="panel autonomous-mode" aria-labelledby="mode-heading"><p class="eyebrow">Sequential, bounded builds</p><h2 id="mode-heading">AUTONOMOUS MODE</h2><form id="mode-form"><div class="form-grid"><label>Max projects<input id="mode-max" type="number" min="1" max="10" value="5" required></label><label class="mode-option"><input id="mode-attention" type="checkbox" checked> Stop on Needs Attention</label><label class="mode-option"><input id="mode-publish" type="checkbox"> Auto-publish to GitHub (OFF by default)</label></div><p class="metadata">Auto-publish ON authorizes the existing generated-project publisher to publish completed, validated apps. Up to 10 project attempts; no parallel builds.</p><button id="mode-start" type="submit" disabled>Start Autonomous Mode</button></form><div id="mode-status" role="status">Loading session…</div></section><section id="factory-stats" class="stats" aria-label="Factory summary"></section><section id="active-run"></section><section><h2>Autonomous projects</h2><div id="autonomous-projects" class="project-list">Loading runs…</div></section><details class="manual"><summary>Manual project planning</summary><section class="panel"><h2>Plan a project manually</h2><form id="project-form" novalidate><div class="form-grid"><label>Project name<input name="name" maxlength="100" required placeholder="e.g. Habit tracker"></label><label>Target platform<select name="platform" required><option value="">Choose a platform</option><option>Web</option><option>Mobile</option><option>Desktop</option><option>API / Backend</option></select></label></div><label>Project description<textarea name="description" maxlength="2000" required placeholder="What problem will it solve, and for whom?"></textarea></label><div class="form-grid"><label>Preferred technology<select name="technology" required><option value="">Choose a technology</option><option>JavaScript</option><option>TypeScript</option><option>Python</option><option>Java</option><option>C#</option><option>Other</option></select></label><label>Experience level<select name="experienceLevel" required><option value="">Choose your level</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label></div><p id="form-error" class="error" role="alert"></p><button type="submit">Generate development plan <span>→</span></button></form></section><section><div class="section-heading"><div><p class="eyebrow">Your workspace</p><h2>Projects</h2></div></div><div id="project-list" class="project-list"><p class="muted">Loading projects…</p></div></section></details></template><script src="app.js"></script></body></html>
